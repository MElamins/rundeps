name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Unit tests
        run: pytest -m "not network"

      - name: CLI smoke test
        run: |
          rundeps --version
          rundeps doctor
          rundeps scan examples/basic.py
          rundeps requirements examples/missing_dependency.py --stdout
          rundeps run examples/basic.py --no-isolation

      - name: Dry run changes nothing
        shell: bash
        run: |
          set -euo pipefail
          before=$(python -c "import hashlib,pathlib;print(hashlib.sha256(pathlib.Path('examples/missing_dependency.py').read_bytes()).hexdigest())")
          rundeps run examples/missing_dependency.py --dry-run
          after=$(python -c "import hashlib,pathlib;print(hashlib.sha256(pathlib.Path('examples/missing_dependency.py').read_bytes()).hexdigest())")
          test "$before" = "$after"
          test ! -d .rundeps/venv

  package:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Verify the wheel installs and runs
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/python -m pip install dist/*.whl
          /tmp/verify/bin/rundeps --version
          /tmp/verify/bin/python -c "import rundeps, json, pathlib; print(len(json.loads((pathlib.Path(rundeps.__file__).parent / 'data' / 'import_map.json').read_text())['mappings']), 'mappings packaged')"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
