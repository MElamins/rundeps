[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "rundeps"
version = "0.1.0"
description = "Run Python without hunting for dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "RunDeps contributors" }]
keywords = ["dependencies", "cli", "developer-tools", "venv", "pip", "imports"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "build>=1.2",
]

[project.scripts]
rundeps = "rundeps.cli:main"

[project.urls]
Homepage = "https://github.com/your-name/rundeps"
Issues = "https://github.com/your-name/rundeps/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/rundeps"]

[tool.hatch.build.targets.sdist]
include = ["src/rundeps", "tests", "examples", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "network: tests that reach PyPI; excluded by default with -m 'not network'",
]

[tool.coverage.run]
source = ["rundeps"]
branch = true
